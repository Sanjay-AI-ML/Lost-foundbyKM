<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ subject|default:"Lost & Found Notification" }}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; color: #334155; }
        .email-container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; }
        .email-header { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); color: #ffffff; padding: 25px 30px; text-align: center; }
        .email-body { padding: 30px; line-height: 1.6; }
        .email-btn { display: inline-block; background-color: #4f46e5; color: #ffffff !important; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 20px; }
        .email-footer { background-color: #f1f5f9; padding: 20px 30px; text-align: center; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="email-header">
            <h2>🧭 Lost & Found Portal</h2>
        </div>
        <div class="email-body">
            <h3>Hello {{ recipient_name|default:"User" }},</h3>
            <p>{{ message_body }}</p>
            {% if action_url %}
                <p style="text-align: center;">
                    <a href="{{ action_url }}" class="email-btn">{{ action_text|default:"View Details" }}</a>
                </p>
            {% endif %}
            <p>Thank you for being part of our community!</p>
        </div>
        <div class="email-footer">
            &copy; Lost & Found Project. All rights reserved.
        </div>
    </div>
</body>
</html>
