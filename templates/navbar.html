{% load static %}
<header class="app-header">
    <div class="navbar-container">
        <!-- Brand Logo -->
        <a href="{% url 'items:home' %}" class="brand-logo">
            <div class="logo-icon-wrapper">
                <i class="fa-solid fa-compass"></i>
            </div>
            <div class="logo-text">
                <span class="logo-primary">Lost</span><span class="logo-accent">&</span><span class="logo-primary">Found</span>
            </div>
        </a>

        <!-- Right Side Nav Actions (Minimal & Clean) -->
        <div class="navbar-actions">
            {% if user.is_authenticated %}
                <!-- System Defense Toggle (Hackathon Demo) -->
                <button class="system-defense-toggle" id="systemDefenseToggle" type="button" title="Toggle BOLA Defense System">
                    <span class="toggle-icon">🛡️</span>
                    <span class="toggle-label">DEFENSE</span>
                    <span class="toggle-status" id="toggleStatus">ON</span>
                </button>

                <!-- Notifications Icon -->
                <a href="{% url 'notifications:list' %}" class="nav-icon-btn" title="Notifications">
                    <i class="fa-solid fa-bell"></i>
                    {% if unread_notifications_count > 0 %}
                        <span class="notif-badge">{{ unread_notifications_count }}</span>
                    {% endif %}
                </a>

                <!-- User Dropdown Menu -->
                <div class="user-menu-dropdown" id="userMenuDropdown">
                    <button class="user-avatar-trigger" id="userMenuBtn" type="button">
                        <img src="{{ user.profile.avatar_url }}" alt="{{ user.username }}" class="nav-user-avatar">
                        <span class="nav-user-name">{{ user.first_name|default:user.username }}</span>
                        <i class="fa-solid fa-chevron-down caret-icon"></i>
                    </button>
                    <div class="user-dropdown-menu" id="userDropdownMenu">
                        <a href="{% url 'items:dashboard' %}" class="dropdown-item">
                            <i class="fa-solid fa-chart-pie"></i> My Dashboard
                        </a>
                        <a href="{% url 'accounts:profile' %}" class="dropdown-item">
                            <i class="fa-solid fa-user"></i> My Profile
                        </a>
                        <div class="dropdown-divider"></div>
                        <a href="{% url 'accounts:logout' %}" class="dropdown-item text-danger">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
                        </a>
                    </div>
                </div>
            {% else %}
                <div class="auth-buttons-nav">
                    <a href="{% url 'accounts:login' %}" class="btn btn-outline btn-sm">
                        <i class="fa-solid fa-right-to-bracket"></i> Sign In
                    </a>
                    <a href="{% url 'accounts:register' %}" class="btn btn-primary btn-sm">
                        <i class="fa-solid fa-user-plus"></i> Register
                    </a>
                </div>
            {% endif %}
        </div>
    </div>
</header>

<script>
    // System Defense Toggle Handler
    document.getElementById('systemDefenseToggle')?.addEventListener('click', async function() {
        try {
            const response = await fetch('/toggle-defense', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || ''
                },
                body: JSON.stringify({})
            });

            const data = await response.json();

            if (data.success) {
                const button = this;
                const statusEl = button.querySelector('#toggleStatus');

                if (data.defense_enabled) {
                    button.classList.remove('defense-off');
                    statusEl.textContent = 'ON';
                } else {
                    button.classList.add('defense-off');
                    statusEl.textContent = 'OFF';
                }

                // Show visual feedback
                button.style.animation = 'pulse 0.6s ease-out';
                setTimeout(() => {
                    button.style.animation = '';
                }, 600);
            }
        } catch (error) {
            console.error('Error toggling defense system:', error);
        }
    });

    // Add pulse animation
    const style = document.createElement('style');
    style.textContent = `
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    `;
    document.head.appendChild(style);
</script>
